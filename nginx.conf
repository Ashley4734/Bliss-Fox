server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # Coolify / Docker health endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Serve the branded 404 for missing routes. Marked internal so /404.html is
    # not itself a public URL (and is excluded from the .html redirect below).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Homepage: serve index.html directly. This avoids nginx's index-directive
    # internal redirect (/ -> /index.html), which would otherwise bounce off the
    # /index.html -> / redirect below and cause an infinite redirect loop.
    location = / {
        try_files /index.html =404;
    }

    # Clean URLs: 301 the legacy .html paths to their extensionless form so
    # /books.html -> /books and /index.html -> / (query strings preserved).
    location = /index.html {
        return 301 /$is_args$args;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1$is_args$args;
    }

    # Product links for the Pinterest catalog live on this (verified) domain and
    # redirect to the matching Etsy listing, so Pinterest accepts the link domain.
    location /listing/ {
        return 301 https://blissfoxstudio.etsy.com$request_uri;
    }

    # Download pages are private, per-kit, and passcode-gated. Each kit lives at
    # an unguessable /download/<slug> path; there is no index. Return the branded
    # 404 for the bare paths so nobody can browse to "the downloads".
    location = /download  { return 404; }
    location = /download/ { return 404; }

    # Machine-readable feeds must always be revalidated so Pinterest and search
    # engines re-read the freshest version. Without this, an upstream cache/CDN
    # (Coolify proxy, Cloudflare) can keep serving an old copy even after the
    # container redeploys with an updated feed — exactly the kind of staleness that
    # freezes a Pinterest catalog on an old snapshot.
    location ~* ^/(pinterest-catalog\.xml|sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Long-lived cache for static assets.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|svg|ico|woff2?|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Serve extensionless URLs by falling back to the matching .html file.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Basic security headers for a public marketing site.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Keep logs useful but not noisy.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
