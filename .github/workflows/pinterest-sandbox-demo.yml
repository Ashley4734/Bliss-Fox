name: Pinterest sandbox demo

# Demonstrates end-to-end Pinterest API usage for the Standard-access review
# video: creates a board, creates a Pin, and reads the Pin back — all in the
# SANDBOX environment (Trial apps can create Pins there but not in production).
#
# Requires repository secrets: PINTEREST_APP_ID, PINTEREST_APP_SECRET,
# PINTEREST_SANDBOX_REFRESH_TOKEN (mint the last one with the token-exchange
# helper using environment=sandbox).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pinterest-sandbox-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Pinterest sandbox demo
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_SANDBOX_REFRESH_TOKEN: ${{ secrets.PINTEREST_SANDBOX_REFRESH_TOKEN }}
          PINTEREST_ENV: sandbox
          MODE: demo
        run: node scripts/pinterest-publish.mjs
