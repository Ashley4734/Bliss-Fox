name: Sync Etsy catalog

# Keeps data/products.json in step with the Bliss Fox Studio Etsy shop.
# Runs on a schedule and can be triggered by hand. When new listings appear
# (or old ones are removed), the committed change redeploys the static site.

on:
  schedule:
    - cron: '0 0 * * *' # every 24 hours at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-etsy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Etsy listings
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_NAME: ${{ vars.ETSY_SHOP_NAME || 'BlissFoxStudio' }}
          ETSY_SALE_PERCENT: ${{ vars.ETSY_SALE_PERCENT }}
        run: node scripts/sync-etsy.mjs

      - name: Commit catalog changes
        run: |
          if [[ -n "$(git status --porcelain data/products.json pinterest-catalog.xml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/products.json pinterest-catalog.xml
            git commit -m "chore: sync Etsy catalog + Pinterest feed"
            git push
          else
            echo "No catalog changes to commit."
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Etsy catalog sync failed"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number' 2>/dev/null || true)
          body="The Etsy catalog sync failed. Run: $run_url

          Check the ETSY_API_KEY / ETSY_SHARED_SECRET secrets and the Etsy API status. The site keeps serving the last good catalog until this succeeds again."
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
