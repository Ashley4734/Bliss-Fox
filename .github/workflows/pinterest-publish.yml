name: Pinterest publish

# Publishes Pins for the shop's own products to its themed boards. Auto-enqueues
# the catalogue, recycles after a cooldown, writes Pin copy (LLM or template),
# and (by default) generates original Pin art via openai/gpt-image-2 on Replicate
# using each product's hero image as a reference.
#
# Posting is spread across five windows per day (1 Pin each = 5/day) so Pins go
# out throughout the day rather than all at once. Minutes are off the top of the
# hour because GitHub delays/drops cron runs scheduled at :00 (peak congestion).
#
# Requires repository secrets: PINTEREST_APP_ID, PINTEREST_APP_SECRET,
# PINTEREST_REFRESH_TOKEN. REPLICATE_API_TOKEN powers image_source=replicate and
# copy_source=llm (without it, the publisher falls back to the Etsy cover +
# template copy).

on:
  schedule:
    - cron: '28 13 * * *' # ~9:28am ET
    - cron: '27 16 * * *' # ~12pm ET
    - cron: '43 19 * * *' # ~3pm ET
    - cron: '11 23 * * *' # ~7pm ET
    - cron: '37 1 * * *'  # ~9pm ET
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify (list boards + product menu, no posting) or publish'
        type: choice
        default: verify
        options: [verify, publish]
      max_per_run:
        description: 'Max Pins to publish this run'
        default: '5'
      image_source:
        description: 'Pin image: replicate (gpt-image-2 from the hero image) or etsy (product cover)'
        type: choice
        default: replicate
        options: [replicate, etsy]
      copy_source:
        description: 'Pin copy: llm (generated, varied) or template'
        type: choice
        default: llm
        options: [llm, template]
      pin_variant:
        description: 'Force one creative variant (leave as rotate to use per-product rotation)'
        type: choice
        default: rotate
        options: [rotate, cover, hands, flatlay, finished, scene]
      dry_run:
        description: 'Log what would be posted (and generated copy) without posting'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pinterest-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Pinterest publisher
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          # Scheduled runs publish 1 Pin each (5 windows/day); manual runs use the
          # chosen mode and count.
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '1' }}
          IMAGE_SOURCE: ${{ inputs.image_source || 'replicate' }}
          COPY_SOURCE: ${{ inputs.copy_source || 'llm' }}
          # 'rotate' (default) leaves PIN_VARIANT empty so per-product rotation runs.
          PIN_VARIANT: ${{ inputs.pin_variant == 'rotate' && '' || inputs.pin_variant }}
          IMAGE_QUALITY: medium
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: node scripts/pinterest-publish.mjs

      - name: Commit queue updates
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        run: |
          if [[ -n "$(git status --porcelain data/pinterest-queue.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/pinterest-queue.json
            git commit -m "chore: mark published Pinterest queue entries"
            git push
          else
            echo "No queue changes to commit."
          fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          title="Pinterest publish workflow failed"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number --jq '.[0].number' 2>/dev/null || true)
          body="The Pinterest publish workflow failed. Run: $run_url

          If this is an auth error, the Pinterest refresh token (PINTEREST_REFRESH_TOKEN) may have expired — re-run the one-time OAuth exchange (see docs/pinterest-standard-access.md) and update the secret."
          if [ -n "${num:-}" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Failed again: $run_url"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
